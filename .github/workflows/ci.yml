name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      build_web:
        description: Build the experimental web target without game data
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  EM_VERSION: 2.0.13
  EM_CACHE_DIR: 'emsdk-cache'

jobs:
  clang_format_check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Validate release versions
      run: |
        python3 tools/release_version.py
        python3 -m unittest discover -s tools -p test_release_version.py
    - name: Install pinned clang-format
      run: |
        python3 -m venv .ci-format
        .ci-format/bin/python -m pip install clang-format==11.1.0.2
    - name: Check formatting
      run: |
        find benchmark src test -type f \( -name '*.hpp' -o -name '*.cpp' -o -name '*.ipp' \) -print0 |
          xargs -0 .ci-format/bin/clang-format --dry-run --Werror
  build_wasm:
    if: github.event_name == 'workflow_dispatch' && inputs.build_web
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup cache for Emscripten
      id: cache-system-libraries
      uses: actions/cache@v4
      with:
        path: ${{env.EM_CACHE_DIR}}
        key: ${{env.EM_VERSION}}-${{ runner.os }}
    - uses: mymindstorm/setup-emsdk@v11
      with:
        version: ${{env.EM_VERSION}}
        actions-cache-folder: ${{env.EM_CACHE_DIR}}
    - name: Run CMake
      run: emcmake cmake -S . -Bbuild_wasm -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DWARNINGS_AS_ERRORS=ON -DWEBASSEMBLY_GAME_PATH=
    - name: Build
      run: make -j2 -Cbuild_wasm
    - uses: actions/upload-artifact@v4
      with:
        name: wasm_build
        path: build_wasm/src/rigelengine-proton.*
  build_linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake g++ libsdl2-dev libsdl2-mixer-dev make
    - name: Configure with tests
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DWARNINGS_AS_ERRORS=ON -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=${{ matrix.build_type == 'Release' }}
    - name: Build
      run: cmake --build build --parallel 2
    - name: Test
      run: ctest --test-dir build --output-on-failure

  build_windows:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install SDL dependencies
      shell: pwsh
      run: |
        $root = $env:VCPKG_INSTALLATION_ROOT
        if (-not (Test-Path -LiteralPath "$root/vcpkg.exe")) { throw "vcpkg not found at $root" }
        & "$root/vcpkg.exe" install sdl2:x64-windows sdl2-mixer:x64-windows
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
        "$root/installed/x64-windows/bin" >> $env:GITHUB_PATH
        "VCPKG_DEFAULT_TRIPLET=x64-windows" >> $env:GITHUB_ENV
    - name: Configure with tests
      shell: pwsh
      run: |
        cmake -S . -B build "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" "-DSDL2_PATH=$env:VCPKG_ROOT/installed/x64-windows" "-DSDL2_MIXER_PATH=$env:VCPKG_ROOT/installed/x64-windows" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_TESTS=ON
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel 2
    - name: Test
      run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Package Windows Release
      if: matrix.build_type == 'Release'
      shell: pwsh
      run: |
        $package = "build/windows-package"
        New-Item -ItemType Directory -Force -Path $package | Out-Null
        Copy-Item build/src/Release/rigelengine-proton.exe $package
        Copy-Item build/src/Release/*.dll $package
        Copy-Item LICENSE.md,README.md "$package/"
        Copy-Item "$env:VCPKG_ROOT/installed/x64-windows/share" "$package/dependency-licenses" -Recurse
        @"
        RigelEngine: Proton for Windows x64.
        Install Microsoft Visual C++ 2015-2022 Redistributable (x64) if needed:
        https://aka.ms/vs/17/release/vc_redist.x64.exe
        Run rigelengine-proton.exe and select your own DOS game files.
        No game data is included. See README.md for setup.
        "@ | Set-Content "$package/START-HERE.txt"
        $version = (Get-Content version.json | ConvertFrom-Json).version
        $zip = "build/rigelengine-proton-$version-windows-x64.zip"
        Compress-Archive -Path "$package/*" -DestinationPath $zip
        $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
        "$hash  $(Split-Path -Leaf $zip)" | Set-Content "$zip.sha256"
    - uses: actions/upload-artifact@v4
      if: matrix.build_type == 'Release'
      with:
        name: rigelengine-proton-windows-x64
        path: build/rigelengine-proton-*-windows-x64.zip*
        if-no-files-found: error

  build_windows_arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install ARM64 SDL dependencies
      shell: pwsh
      run: |
        $root = $env:VCPKG_INSTALLATION_ROOT
        if (-not (Test-Path -LiteralPath "$root/vcpkg.exe")) { throw "vcpkg not found at $root" }
        & "$root/vcpkg.exe" install sdl2:arm64-windows sdl2-mixer:arm64-windows
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
        "$root/installed/arm64-windows/bin" >> $env:GITHUB_PATH
        "VCPKG_DEFAULT_TRIPLET=arm64-windows" >> $env:GITHUB_ENV
    - name: Configure with tests
      shell: pwsh
      run: |
        cmake -S . -B build-arm64 -A ARM64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=arm64-windows" "-DSDL2_PATH=$env:VCPKG_ROOT/installed/arm64-windows" "-DSDL2_MIXER_PATH=$env:VCPKG_ROOT/installed/arm64-windows" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DBUILD_TESTS=ON
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build
      run: cmake --build build-arm64 --config Release --parallel 2
    - name: Test
      run: ctest --test-dir build-arm64 --build-config Release --output-on-failure
    - name: Package and verify ARM64 executable and DLLs
      shell: pwsh
      run: |
        $package = "build-arm64/windows-package"
        New-Item -ItemType Directory -Force -Path $package | Out-Null
        Copy-Item build-arm64/src/Release/rigelengine-proton.exe $package
        Copy-Item build-arm64/src/Release/*.dll $package
        Copy-Item LICENSE.md,README.md "$package/"
        Copy-Item "$env:VCPKG_ROOT/installed/arm64-windows/share" "$package/dependency-licenses" -Recurse
        foreach ($file in Get-ChildItem $package -File | Where-Object { $_.Extension -in '.exe', '.dll' }) {
          $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Not a PE binary: $($file.Name)" }
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($offset -lt 0 -or $offset + 6 -gt $bytes.Length -or [BitConverter]::ToUInt32($bytes, $offset) -ne 0x4550 -or [BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0xaa64) { throw "Not a native ARM64 binary: $($file.Name)" }
        }
        @"
        RigelEngine: Proton for Windows ARM64 (experimental CI build).
        Install Microsoft Visual C++ 2015-2022 Redistributable (ARM64) if needed:
        https://aka.ms/vs/17/release/vc_redist.arm64.exe
        Run rigelengine-proton.exe and select your own DOS game files.
        No game data is included. See README.md for setup.
        "@ | Set-Content "$package/START-HERE.txt"
        $version = (Get-Content version.json | ConvertFrom-Json).version
        $zip = "build-arm64/rigelengine-proton-$version-windows-arm64.zip"
        Compress-Archive -Path "$package/*" -DestinationPath $zip
        $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
        "$hash  $(Split-Path -Leaf $zip)" | Set-Content "$zip.sha256"
    - uses: actions/upload-artifact@v4
      with:
        name: rigelengine-proton-windows-arm64
        path: build-arm64/rigelengine-proton-*-windows-arm64.zip*
        if-no-files-found: error

  build_android:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Install pinned Android toolchain
      run: sdkmanager "platforms;android-33" "build-tools;35.0.0" "ndk;27.2.12479018"
    - name: Test Android game-data imports
      run: bash tools/test_android_import.sh
    - name: Cache verified SDL downloads
      uses: actions/cache@v4
      with:
        path: build-android/downloads
        key: android-sdl-2.30.9-mixer-2.8.0
    - name: Build and verify APK without game data
      env:
        RIGEL_ANDROID_JOBS: '2'
      run: |
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
        bash tools/build_android.sh
    - name: Upload Android APKs
      uses: actions/upload-artifact@v4
      with:
        name: rigelengine-proton-android-arm64-apks
        path: build-android/output/
        if-no-files-found: error
        retention-days: 14
