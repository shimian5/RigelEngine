name: Bundling

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build_package_linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake g++ libsdl2-dev libsdl2-mixer-dev make
    - name: Run CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    - name: Build
      run: cd build && make -j2
    - name: Package (deb)
      run: cd build && cpack -G "DEB" && mv packages/rigelengine-proton.deb packages/rigelengine-proton_linux_x64.deb && mv packages/rigelengine-proton.deb.sha256 packages/rigelengine-proton_linux_x64.deb.sha256
    - name: Run CMake (GL ES version)
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DUSE_GL_ES=ON
    - name: Build (GL ES version)
      run: cd build && make -j2
    - name: Package (deb), GL ES version
      run: cd build && cpack -G "DEB" && mv packages/rigelengine-proton.deb packages/rigelengine-proton_linux_gles_x64.deb && mv packages/rigelengine-proton.deb.sha256 packages/rigelengine-proton_linux_gles_x64.deb.sha256
    - uses: actions/upload-artifact@v4
      with:
        name: ubuntu_deb_build
        path: build/packages/*.deb*
