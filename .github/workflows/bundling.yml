name: Bundling

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_package_linux:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          arch: x64
          renderers: gl
        - os: ubuntu-24.04-arm
          arch: arm64
          renderers: gl gles
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake g++ libsdl2-dev libsdl2-mixer-dev make dpkg-dev
    - name: Build and package
      env:
        ARCH: ${{ matrix.arch }}
        RENDERERS: ${{ matrix.renderers }}
      run: |
        version=$(python3 tools/release_version.py | head -1)
        mkdir -p dist-packages
        for renderer in $RENDERERS; do
          extra=()
          if [[ "$renderer" == gles ]]; then extra=(-DUSE_GL_ES=ON); fi
          cmake -S . -B "build-$renderer" -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 "${extra[@]}"
          cmake --build "build-$renderer" --parallel 2
          (cd "build-$renderer" && cpack -G DEB && cpack -G TGZ)
          for ext in deb tar.gz; do
            name="rigelengine-proton-$version-linux-$ARCH-$renderer.$ext"
            source="build-$renderer/packages/rigelengine-proton.$ext"
            if [[ "$ext" == tar.gz ]]; then source="build-$renderer/packages/rigelengine-proton-bin.tar.gz"; fi
            cp "$source" "dist-packages/$name"
            (cd dist-packages && sha256sum "$name" > "$name.sha256")
          done
        done
    - uses: actions/upload-artifact@v4
      with:
        name: rigelengine-proton-linux-${{ matrix.arch }}
        path: dist-packages/
        if-no-files-found: error
